<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 20px;
      max-width: 1000px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    header h1 {
      font-size: 2.2rem;
      color: var(--accent);
      margin-bottom: 8px;
    }

    header p {
      color: var(--text-muted);
    }

    .controls-card {
      background-color: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 25px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    select {
      background-color: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 10px;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
    }

    select:focus {
      border-color: var(--accent);
    }

    .size-info {
      background-color: rgba(56, 189, 248, 0.1);
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 14px;
      border-radius: 8px;
      margin-bottom: 25px;
      text-align: center;
      font-weight: 600;
      font-size: 1.05rem;
    }

    .tire-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .tire-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .tire-card:hover {
      border-color: var(--accent);
      transform: translateY(-3px);
    }

    .badge {
      align-self: flex-start;
      background-color: #0284c7;
      color: #fff;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .badge-budget { background-color: #16a34a; }
    .badge-durability { background-color: #d97706; }
    .badge-comfort { background-color: #9333ea; }
    .badge-wet { background-color: #2563eb; }

    .tire-card h3 {
      font-size: 1.25rem;
      margin-bottom: 6px;
    }

    .brand-tag {
      font-size: 0.85rem;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 10px;
    }

    .tire-card p {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 15px;
      line-height: 1.4;
    }

    .tire-meta {
      border-top: 1px solid var(--border);
      padding-top: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .rating {
      font-size: 0.85rem;
      color: #f59e0b;
      font-weight: 600;
    }

    .price {
      font-size: 1.15rem;
      font-weight: 700;
      color: #10b981;
    }
  </style>

    const carSelect = document.getElementById("carSelect");

    const categoryFilter = document.getElementById("categoryFilter");
    const sizeInfo = document.getElementById("sizeInfo");
    const tireGrid = document.getElementById("tireGrid");

    function updateTrims() {
      const selectedCarKey = carSelect.value;
      const car = carsData[selectedCarKey];
      trimSelect.innerHTML = "";

      if (car && car.trims) {
        for (let trim in car.trims) {
          const option = document.createElement("option");
          option.value = trim;
          option.textContent = trim;
          trimSelect.appendChild(option);
        }
      }
      render();
    }

    function render() {
      const selectedCarKey = carSelect.value;
      const selectedTrim = trimSelect.value;
      const selectedCountry = countrySelect.value;
      const selectedCategory = categoryFilter.value;

      const car = carsData[selectedCarKey];
      if (!car) return;

      const tireSize = (car.trims && car.trims[selectedTrim]) ? car.trims[selectedTrim] : "Standard OEM Size";
      sizeInfo.textContent = `Recommended Tire Spec for ${car.name}: ${tireSize}`;

      let filteredTires = car.tires || [];
      if (selectedCategory !== "all") {
        filteredTires = filteredTires.filter(t => t.category === selectedCategory);
      }

      tireGrid.innerHTML = "";
      if (filteredTires.length === 0) {
        tireGrid.innerHTML = `<p style="grid-column: 1/-1; text-align:center; color: var(--text-muted); padding: 30px;">No specific tires listed under this exact category filter. Try selecting 'All Categories'.</p>`;
        return;
      }

      filteredTires.forEach(tire => {
        const price = (tire.prices && tire.prices[selectedCountry]) ? tire.prices[selectedCountry] : "Contact Dealer";
        const card = document.createElement("div");
        card.className = "tire-card";
        card.innerHTML = `
          <div>
            <span class="badge ${tire.badgeClass || ''}">${tire.category}</span>
            <div class="brand-tag">${tire.brand}</div>
            <h3>${tire.name}</h3>
            <p>${tire.desc}</p>
          </div>
          <div class="tire-meta">
            <span class="rating">${tire.rating}</span>
            <span class="price">${price}</span>
          </div>
        `;
        tireGrid.appendChild(card);
      });
    }

    carSelect.addEventListener("change", updateTrims);
    trimSelect.addEventListener("change", render);
    countrySelect.addEventListener("change", render);
    categoryFilter.addEventListener("change", render);

    updateTrims();
  </script>
</body>
</html>
